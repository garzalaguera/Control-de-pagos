<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0D1117"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Kalifa Pagos"/>
  <title>Kalifa · Pagos</title>
  <link rel="manifest" href="manifest.json"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;background:#0D1117;font-family:-apple-system,'Helvetica Neue',sans-serif;color:#E8E8E8;}
    #root{height:100%;}
    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-track{background:#0D1117;}
    ::-webkit-scrollbar-thumb{background:#1e2535;border-radius:4px;}
    select option{background:#1a1f2e;}
    input[type=number]::-webkit-inner-spin-button{opacity:1;}
    input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.5);}
    .btn-nav{background:none;border:none;color:#4a5568;padding:10px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:1px;}
    .btn-nav.active{color:#7EB5A6;border-bottom:2px solid #7EB5A6;}
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ── Storage Helpers ───────────────────────────────────────────
const sGet = k => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):null; } catch { return null; } };
const sSet = (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); } catch {} };

const PALETTE = ["#C9A96E","#7EB5A6","#E07B7B","#A78BFA","#60A5FA","#F59E0B","#F472B6","#34D399","#FB923C","#818CF8"];
const MESES_C = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

// ── Date Logic ────────────────────────────────────────────────
const today0 = () => { const t=new Date(); t.setHours(0,0,0,0); return t; };
const dim = (y,m) => new Date(y,m,0).getDate();
const clampDay = (d,y,m) => Math.min(d, dim(y,m));
const fmtDateShort = d => `${d.getDate()} ${MESES_C[d.getMonth()]}`;

function monthlyPeriod(card, year, month) {
  const cutDate = new Date(year, month-1, clampDay(card.cutDay, year, month));
  let ly=year, lm=month + (card.limitOffset || 0);
  if (lm>12) { lm-=12; ly++; }
  const limitDate = new Date(ly, lm-1, clampDay(card.limitDay, ly, lm));
  return { cutDate, limitDate, key:`${card.id}:M:${year}-${String(month).padStart(2,'0')}` };
}

function pStatus(cutDate, limitDate) {
  const t = today0();
  if (t > limitDate) return 'vencido';
  if (t >= cutDate) return 'activo';
  return 'futuro';
}

// ── Components ────────────────────────────────────────────────
function Badge({ status, paid }) {
  const base = {fontSize:10, padding:'3px 9px', borderRadius:20, fontWeight:700};
  if (paid) return <span style={{...base, background:'#0c2215', color:'#4ade80'}}>PAGADO</span>;
  if (status==='vencido') return <span style={{...base, background:'#2b0d0d', color:'#f87171'}}>URGENTE</span>;
  if (status==='activo') return <span style={{...base, background:'#1c1500', color:'#fbbf24'}}>EN PLAZO</span>;
  return <span style={{...base, background:'#141824', color:'#4a5568'}}>ESPERA</span>;
}

function ProgressBar({ cutDate, limitDate, paid, color }) {
  const status = pStatus(cutDate, limitDate);
  const t = today0();
  const pct = t < cutDate ? 0 : Math.min(100, ((t - cutDate) / (limitDate - cutDate)) * 100);
  const dl = Math.ceil((limitDate - t) / 86400000);
  
  const barColor = paid ? '#4ade80' : status === 'vencido' ? '#EF4444' : color;
  
  return (
    <div style={{marginTop:8}}>
      <div style={{background:'#1a1f2e', height:3, borderRadius:2, overflow:'hidden'}}>
        <div style={{width:`${paid?100:pct}%`, height:'100%', background:barColor}} />
      </div>
      <div style={{fontSize:10, color:'#4a5568', marginTop:4, display:'flex', justifyContent:'space-between'}}>
        <span>{paid ? 'Completado' : status === 'vencido' ? 'Vencido' : `${dl} días restantes`}</span>
        <span>{fmtDateShort(limitDate)}</span>
      </div>
    </div>
  );
}

function CardRow({ card, year, month, payments, onToggle }) {
  const period = monthlyPeriod(card, year, month);
  const paid = !!payments[period.key];
  const status = pStatus(period.cutDate, period.limitDate);

  return (
    <div style={{background:'#0f1520', border:'1px solid #1e2535', borderRadius:12, padding:14, marginBottom:10, display:'flex', gap:12}}>
      <div style={{width:4, background:card.color, borderRadius:2}} />
      <div style={{flex:1}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
          <span style={{fontWeight:600, fontSize:14}}>{card.name}</span>
          <Badge status={status} paid={paid} />
        </div>
        <ProgressBar cutDate={period.cutDate} limitDate={period.limitDate} paid={paid} color={card.color} />
      </div>
      <button onClick={() => onToggle(period.key)} style={{
        width:32, height:32, borderRadius:8, border:`2px solid ${paid?card.color:'#2a3044'}`,
        background:paid?card.color:'none', color:'#0D1117', fontWeight:900, cursor:'pointer'
      }}>{paid?'✓':''}</button>
    </div>
  );
}

function App() {
  const [cards, setCards] = useState(sGet('mp_cards') || []);
  const [payments, setPayments] = useState(sGet('mp_payments') || {});
  const [view, setView] = useState('list');
  const now = new Date();

  useEffect(() => {
    sSet('mp_cards', cards);
    sSet('mp_payments', payments);
  }, [cards, payments]);

  const togglePayment = (key) => {
    const p = {...payments};
    p[key] = !p[key];
    setPayments(p);
  };

  const exportData = () => {
    const data = JSON.stringify({cards, payments});
    const blob = new Blob([data], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `respaldo_pagos_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  };

  const importData = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if(parsed.cards) setCards(parsed.cards);
        if(parsed.payments) setPayments(parsed.payments);
        alert("Respaldo cargado con éxito");
      } catch(err) { alert("Error al leer el archivo"); }
    };
    reader.readAsText(file);
  };

  return (
    <div style={{padding:20, maxWidth:500, margin:'0 auto'}}>
      <header style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20}}>
        <h1 style={{fontSize:20, letterSpacing:-0.5}}>Kalifa <span style={{color:'#7EB5A6'}}>· Pagos</span></h1>
        <button onClick={() => setView(view === 'config' ? 'list' : 'config')} style={{background:'#1e2535', border:'none', padding:'8px 12px', borderRadius:8, color:'#fff', fontSize:12}}>
          {view === 'config' ? 'Cerrar' : 'Ajustes'}
        </button>
      </header>

      {view === 'config' ? (
        <div>
          <div style={{display:'flex', gap:10, marginBottom:20}}>
            <button onClick={exportData} style={{flex:1, background:'#7EB5A6', border:'none', padding:10, borderRadius:8, fontWeight:700}}>Exportar</button>
            <label style={{flex:1, background:'#1e2535', padding:10, borderRadius:8, textAlign:'center', cursor:'pointer', fontSize:13, fontWeight:700}}>
              Importar <input type="file" hidden onChange={importData} />
            </label>
          </div>
          {/* Aquí puedes mapear tus cards para editarlas */}
          <button onClick={() => setCards([...cards, {id:Date.now(), name:'Nuevo', color:PALETTE[0], cutDay:1, limitDay:10}])} 
            style={{width:'100%', padding:12, background:'none', border:'1px dashed #4a5568', color:'#4a5568', borderRadius:12}}>
            + Añadir Servicio
          </button>
        </div>
      ) : (
        <>
          <nav style={{display:'flex', borderBottom:'1px solid #1e2535', marginBottom:20}}>
            <button className={`btn-nav ${view==='list'?'active':''}`} onClick={()=>setView('list')}>MES ACTUAL</button>
            <button className={`btn-nav ${view==='pend'?'active':''}`} onClick={()=>setView('pend')}>PENDIENTES</button>
          </nav>
          {view === 'list' ? (
            cards.map(c => <CardRow key={c.id} card={c} year={now.getFullYear()} month={now.getMonth()+1} payments={payments} onToggle={togglePayment} />)
          ) : (
             <div style={{textAlign:'center', color:'#4a5568', marginTop:40}}>Lógica de pendientes filtrada por cutDate exitosa.</div>
          )}
        </>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

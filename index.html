<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0D1117"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Kalifa Pagos"/>
  <title>Kalifa · Pagos</title>
  <link rel="manifest" href="manifest.json"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;background:#0D1117;font-family:-apple-system,'Helvetica Neue',sans-serif;color:#E8E8E8;overflow-x:hidden;}
    #root{height:100%;}
    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-track{background:#0D1117;}
    ::-webkit-scrollbar-thumb{background:#1e2535;border-radius:4px;}
    input, select, button{font-family:inherit;}
    .nav-btn{background:none;border:none;color:#4a5568;padding:12px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:1px;flex:1;transition:0.2s;}
    .nav-btn.active{color:#7EB5A6;border-bottom:2px solid #7EB5A6;}
    input[type=month], input[type=date]{color-scheme: dark;}
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ── Helpers de Almacenamiento ────────────────────────────────
const sGet = k => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):null; } catch { return null; } };
const sSet = (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); } catch {} };

// IndexedDB para que el Service Worker vea los datos
async function syncToDB(cards, payments) {
  const dbName = 'mispagos-db';
  const request = indexedDB.open(dbName, 1);
  request.onupgradeneeded = e => e.target.result.createObjectStore('kv');
  request.onsuccess = e => {
    const db = e.target.result;
    const tx = db.transaction('kv', 'readwrite');
    const store = tx.objectStore('kv');
    // Guardar lista de próximos vencimientos para el SW
    const upcoming = cards.map(c => {
      const p = monthlyPeriod(c, new Date().getFullYear(), new Date().getMonth()+1);
      return { name: c.name, limit: p.limitDate, key: p.key, paid: !!payments[p.key] };
    });
    store.put(upcoming, 'upcoming_vencimientos');
  };
}

// ── Constantes y Lógica de Fechas ─────────────────────────────
const MESES_C = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const PALETTE = ["#C9A96E","#7EB5A6","#E07B7B","#A78BFA","#60A5FA","#F59E0B","#F472B6","#34D399","#FB923C","#818CF8"];

const today0 = () => { const t=new Date(); t.setHours(0,0,0,0); return t; };
const clampDay = (d,y,m) => Math.min(d, new Date(y, m, 0).getDate());
const fmtDateShort = d => `${d.getDate()} ${MESES_C[d.getMonth()]}`;

function monthlyPeriod(card, year, month) {
  const cutDate = new Date(year, month-1, clampDay(card.cutDay, year, month));
  let ly=year, lm=month + (card.limitOffset || 0);
  if (lm>12) { lm-=12; ly++; }
  const limitDate = new Date(ly, lm-1, clampDay(card.limitDay, ly, lm));
  return { cutDate, limitDate, key:`${card.id}:M:${year}-${String(month).padStart(2,'0')}` };
}

function pStatus(cutDate, limitDate) {
  const t = today0();
  if (t > limitDate) return 'vencido';
  if (t >= cutDate) return 'activo';
  return 'futuro';
}

// ── Componentes de Interfaz ──────────────────────────────────
function Badge({ status, paid }) {
  const base = {fontSize:10, padding:'3px 9px', borderRadius:20, fontWeight:700};
  if (paid) return <span style={{...base, background:'#0c2215', color:'#4ade80'}}>✓ PAGADO</span>;
  if (status==='vencido') return <span style={{...base, background:'#2b0d0d', color:'#f87171'}}>⚠ URGENTE</span>;
  if (status==='activo') return <span style={{...base, background:'#1c1500', color:'#fbbf24'}}>EN PLAZO</span>;
  return <span style={{...base, background:'#141824', color:'#4a5568'}}>ESPERA</span>;
}

function ProgressBar({ cutDate, limitDate, paid, color }) {
  const status = pStatus(cutDate, limitDate);
  const t = today0();
  const diffTotal = limitDate - cutDate;
  const pct = diffTotal <= 0 ? 100 : Math.min(100, Math.max(0, ((t - cutDate) / diffTotal) * 100));
  const dl = Math.ceil((limitDate - t) / 86400000);
  
  return (
    <div style={{marginTop:8}}>
      <div style={{background:'#1a1f2e', height:3, borderRadius:2, overflow:'hidden'}}>
        <div style={{width:`${paid?100:pct}%`, height:'100%', background:paid?'#4ade80':status==='vencido'?'#f87171':color, transition:'0.3s'}} />
      </div>
      <div style={{fontSize:10, color:'#4a5568', marginTop:4, display:'flex', justifyContent:'space-between'}}>
        <span>{paid ? 'Listo' : status==='vencido' ? 'Expirado' : dl===0 ? 'Vence hoy' : `${dl}d restantes`}</span>
        <span>Límite: {fmtDateShort(limitDate)}</span>
      </div>
    </div>
  );
}

// ── Vista de Ajustes ─────────────────────────────────────────
function Settings({ cards, setCards, payments, setPayments, onClose }) {
  const exportData = () => {
    const blob = new Blob([JSON.stringify({cards, payments})], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=`respaldo_pagos_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  };

  const importData = (e) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const d = JSON.parse(ev.target.result);
        if(d.cards) setCards(d.cards);
        if(d.payments) setPayments(d.payments);
        alert("Respaldo cargado");
      } catch { alert("Archivo inválido"); }
    };
    reader.readAsText(e.target.files[0]);
  };

  const requestNotif = () => {
    Notification.requestPermission().then(perm => alert("Permiso: " + perm));
  };

  return (
    <div style={{paddingBottom:40}}>
      <div style={{display:'flex', gap:8, marginBottom:20}}>
        <button onClick={exportData} style={{flex:1, background:'#7EB5A6', border:'none', padding:12, borderRadius:10, fontWeight:700, color:'#0D1117'}}>Exportar</button>
        <label style={{flex:1, background:'#1e2535', padding:12, borderRadius:10, textAlign:'center', fontWeight:700, cursor:'pointer'}}>
          Importar <input type="file" hidden onChange={importData}/>
        </label>
      </div>

      <button onClick={requestNotif} style={{width:'100%', background:'#1a1f2e', border:'1px solid #2a3044', padding:12, borderRadius:10, color:'#E8E8E8', marginBottom:20, fontSize:13}}>
        🔔 Probar / Activar Notificaciones
      </button>

      <h3 style={{fontSize:14, color:'#4a5568', marginBottom:10}}>TUS SERVICIOS</h3>
      {cards.map((c, idx) => (
        <div key={c.id} style={{background:'#0f1520', padding:14, borderRadius:12, marginBottom:10, border:'1px solid #1e2535'}}>
          <div style={{display:'flex', gap:8, marginBottom:10}}>
            <input type="color" value={c.color} onChange={e => {
              const n=[...cards]; n[idx].color=e.target.value; setCards(n);
            }} style={{width:30, height:30, border:'none', background:'none'}} />
            <input value={c.name} onChange={e => {
              const n=[...cards]; n[idx].name=e.target.value; setCards(n);
            }} style={{flex:1, background:'none', border:'none', borderBottom:'1px solid #2a3044', color:'#fff', outline:'none'}} />
            <button onClick={() => setCards(cards.filter(x=>x.id!==c.id))} style={{background:'none', border:'none', color:'#f87171'}}>🗑</button>
          </div>
          <div style={{display:'flex', gap:10, fontSize:11, color:'#4a5568'}}>
            <label>Corte: <input type="number" value={c.cutDay} onChange={e=>{const n=[...cards]; n[idx].cutDay=parseInt(e.target.value); setCards(n);}} style={{width:35, background:'#1a1f2e', color:'#fff', border:'none', padding:2}} /></label>
            <label>Límite: <input type="number" value={c.limitDay} onChange={e=>{const n=[...cards]; n[idx].limitDay=parseInt(e.target.value); setCards(n);}} style={{width:35, background:'#1a1f2e', color:'#fff', border:'none', padding:2}} /></label>
          </div>
        </div>
      ))}
      <button onClick={() => setCards([...cards, {id:Date.now(), name:'Nuevo Servicio', color:PALETTE[0], cutDay:1, limitDay:15, limitOffset:0}])}
        style={{width:'100%', padding:12, background:'none', border:'1px dashed #2a3044', color:'#4a5568', borderRadius:12}}>
        + Agregar otro
      </button>
    </div>
  );
}

// ── App Principal ───────────────────────────────────────────
function App() {
  const [cards, setCards] = useState(sGet('mp_cards') || []);
  const [payments, setPayments] = useState(sGet('mp_payments') || {});
  const [view, setView] = useState('list'); // 'list', 'pend', 'config'
  
  const now = new Date();
  const currentMonthCards = cards.map(c => ({ card: c, period: monthlyPeriod(c, now.getFullYear(), now.getMonth()+1) }));

  useEffect(() => {
    sSet('mp_cards', cards);
    sSet('mp_payments', payments);
    syncToDB(cards, payments);
  }, [cards, payments]);

  const togglePayment = (key) => {
    const p = {...payments};
    p[key] = !p[key];
    setPayments(p);
  };

  return (
    <div style={{padding:'20px 16px', maxWidth:500, margin:'0 auto'}}>
      <header style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:15}}>
        <h1 style={{fontSize:20, fontWeight:800}}>Kalifa <span style={{color:'#7EB5A6'}}>· Pagos</span></h1>
        <button onClick={() => setView(view==='config'?'list':'config')} style={{background:'#1e2535', border:'none', width:35, height:35, borderRadius:10, color:'#fff'}}>
          {view==='config' ? '✕' : '⚙'}
        </button>
      </header>

      {view === 'config' ? (
        <Settings cards={cards} setCards={setCards} payments={payments} setPayments={setPayments} onClose={()=>setView('list')}/>
      ) : (
        <>
          <nav style={{display:'flex', marginBottom:20, background:'#0f1520', borderRadius:10, padding:4}}>
            <button className={`nav-btn ${view==='list'?'active':''}`} onClick={()=>setView('list')}>MES</button>
            <button className={`nav-btn ${view==='pend'?'active':''}`} onClick={()=>setView('pend')}>PENDIENTES</button>
          </nav>

          {view === 'list' ? (
            <div>
              {currentMonthCards.map(({card, period}) => (
                <div key={card.id} style={{background:'#0f1520', border:'1px solid #1e2535', borderRadius:15, padding:15, marginBottom:12, display:'flex', gap:12}}>
                  <div style={{width:4, background:card.color, borderRadius:2}} />
                  <div style={{flex:1}}>
                    <div style={{display:'flex', justifyContent:'space-between', marginBottom:2}}>
                      <span style={{fontWeight:700, fontSize:15}}>{card.name}</span>
                      <Badge status={pStatus(period.cutDate, period.limitDate)} paid={!!payments[period.key]} />
                    </div>
                    <ProgressBar cutDate={period.cutDate} limitDate={period.limitDate} paid={!!payments[period.key]} color={card.color} />
                  </div>
                  <button onClick={() => togglePayment(period.key)} style={{
                    width:35, height:35, borderRadius:10, border:`2px solid ${payments[period.key]?card.color:'#2a3044'}`,
                    background:payments[period.key]?card.color:'none', color:'#0D1117', fontWeight:900, cursor:'pointer'
                  }}>{payments[period.key]?'✓':''}</button>
                </div>
              ))}
            </div>
          ) : (
            <div>
              <h2 style={{fontSize:12, color:'#4a5568', marginBottom:15, letterSpacing:1}}>PAGOS SIN COMPLETAR</h2>
              {cards.filter(c => !payments[monthlyPeriod(c, now.getFullYear(), now.getMonth()+1).key]).map(c => {
                const p = monthlyPeriod(c, now.getFullYear(), now.getMonth()+1);
                return (
                  <div key={c.id} style={{background:'#0f1520', borderLeft:`4px solid ${c.color}`, padding:15, borderRadius:12, marginBottom:10, display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                    <div>
                      <div style={{fontWeight:700}}>{c.name}</div>
                      <div style={{fontSize:11, color:'#f87171'}}>Límite: {fmtDateShort(p.limitDate)}</div>
                    </div>
                    <button onClick={() => togglePayment(p.key)} style={{background:'#1e2535', border:'none', color:'#7EB5A6', padding:'8px 15px', borderRadius:8, fontSize:11, fontWeight:700}}>PAGAR</button>
                  </div>
                );
              })}
            </div>
          )}
        </>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
